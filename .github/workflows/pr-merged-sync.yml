name: PR Merged Sync

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: jameslac/github-workflows/.github/workflows/pr-merged-sync.yml@main
    secrets: inherit
    with:
      trello_done_list: "Done"
