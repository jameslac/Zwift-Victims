name: Cleanup Cloudflare Preview

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: read

concurrency:
  group: cleanup-preview-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: false

jobs:
  cleanup-preview:
    name: Delete Worker Preview
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Delete Cloudflare Worker Preview
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.event.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "main" ] || [ "$BRANCH_NAME" = "master" ]; then
            echo "Skipping preview cleanup for protected or empty branch: '$BRANCH_NAME'"
            exit 0
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::Skipping Cloudflare preview cleanup: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not configured."
            exit 0
          fi

          set +e
          OUTPUT=$(npx wrangler preview delete --name "$BRANCH_NAME" --skip-confirmation 2>&1)
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          if printf '%s\n' "$OUTPUT" | grep -qiE '\[code: 10025\]|preview.*(not found|does not exist)'; then
            echo "Preview for branch '$BRANCH_NAME' was not found or already deleted; treating as clean."
            exit 0
          fi

          exit "$STATUS"
